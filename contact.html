<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aabora</title>
<meta name="description" content="Aabora: handmade jewelry. Gioielli artigianali. Χειροποίητα κοσμήματα.">
<link rel="icon" href="assets/images/logo/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/images/logo/apple-touch-icon.png">

<body data-page="contact" data-root="" data-title="contact.title">
<header id="site-header"></header>
<main class="container narrow">
  <h1 class="page-title" data-i18n="contact.title"></h1>
  <p data-i18n="contact.intro"></p>
  <!-- Replace the address below with your real email, or point action at a form service. -->
  <form action="mailto:hello@aabora.example" method="post" enctype="text/plain">
    <label><span data-i18n="contact.name"></span><input name="name" required></label>
    <label><span data-i18n="contact.email"></span><input name="email" type="email" required></label>
    <label><span data-i18n="contact.message"></span><textarea name="message" rows="5" required></textarea></label>
    <button class="cta" type="submit" data-i18n="contact.send"></button>
  </form>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/wishlist.js"></script>
<script src="assets/js/products.js"></script>

</body>
